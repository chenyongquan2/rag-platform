# Local infrastructure for development (design s16-5). The Python app runs on the host via `uv run`.
# Start and wait for health: scripts/dev_up.sh. Every port is bound to 127.0.0.1 only.
#
# Host port = standard port + 20000. On this machine the Windows dynamic port range is 1024-15000
# and Hyper-V reserves blocks inside it (6380-6479 at the time of writing), and other local
# projects already use 6379, 4317, 4318, 13133 and 16686. ServiceSettings defaults match these ports.
#   Elasticsearch    http://127.0.0.1:29200
#   Redis            redis://127.0.0.1:26379/0
#   OTLP gRPC        http://127.0.0.1:24317    OTLP HTTP http://127.0.0.1:24318
#   Collector health http://127.0.0.1:33133/
#   Jaeger UI        http://127.0.0.1:36686/
name: rag-platform

services:
  elasticsearch:
    # Pinned minor version: dense_vector defaults changed twice in 9.x (design s7-3).
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      cluster.name: rag-local
      node.name: es01
      # Basic license (free). Security is OFF for local development only: no TLS, no password,
      # reachable only from this machine (127.0.0.1). Never use this setting outside a dev box.
      xpack.license.self_generated.type: basic
      xpack.security.enabled: "false"
      # Machine learning is not used; turning it off saves memory and start-up time.
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms2g -Xmx2g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:29200:9200"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null || exit 1
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 180s
      start_interval: 2s

  redis-cache:
    # Cache and rate-limit counters; evicts least recently used keys when full (design s16-5).
    # No persistence: the data generation counter survives restarts by design (rag.index.generation).
    image: redis:8.10.2-alpine
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./data/otel:/data/otel
    ports:
      - "127.0.0.1:24317:4317"
      - "127.0.0.1:24318:4318"
      - "127.0.0.1:33133:13133"
    # The image has no shell or HTTP client, so there is no container healthcheck;
    # scripts/dev_up.sh polls the health_check extension from the host instead.
    depends_on:
      jaeger:
        condition: service_healthy

  jaeger:
    # Jaeger v2 all-in-one (v1 all-in-one is end of life); traces are kept in memory.
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:36686:16686"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/status"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  es-data:
