<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">rag-platform architecture</title>
        <desc id="architecture-desc">Documents are chunked, embedded and written to a versioned Elasticsearch index; a question is searched with BM25 and vectors, reranked, handled by the ask_docs graph and answered with numbered citations, with a cache and telemetry on the side.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- zones -->
        <rect x="30" y="52" width="240" height="218" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="112" y="56" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="150" y="65" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">INGESTION</text>

        <rect x="670" y="52" width="260" height="428" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="772" y="56" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="800" y="65" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">QUERY</text>

        <!-- arrows first -->
        <path d="M150,148 V190" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <path d="M250,222 H360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <rect x="282" y="202" width="46" height="12" rx="2" fill="#f5f5f5"/>
        <text x="305" y="211" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">VECTORS</text>

        <path d="M560,222 H596 Q604,222 604,214 V136 Q604,128 612,128 H700" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#architecture-arrow-accent)"/>
        <rect x="616" y="168" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="630" y="177" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>

        <path d="M700,104 H560" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>
        <rect x="598" y="84" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="630" y="93" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">L1 LOOKUP</text>

        <path d="M800,148 V190" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <rect x="812" y="163" width="38" height="12" rx="2" fill="#f5f5f5"/>
        <text x="831" y="172" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TOP 10</text>

        <path d="M800,254 V296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <rect x="812" y="269" width="38" height="12" rx="2" fill="#f5f5f5"/>
        <text x="831" y="278" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SCORED</text>

        <path d="M800,360 V402" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <rect x="812" y="375" width="58" height="12" rx="2" fill="#f5f5f5"/>
        <text x="841" y="384" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SSE STREAM</text>

        <path d="M700,328 H560" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>
        <rect x="590" y="308" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="626" y="317" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TRACES · COST</text>

        <!-- nodes: Documents (input) -->
        <rect x="50" y="84" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="50" y="84" width="200" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="150" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Documents</text>
        <text x="150" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">md · ipynb · CHM · PDF</text>

        <!-- Chunk and embed -->
        <rect x="50" y="190" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="50" y="190" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="150" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Chunk and embed</text>
        <text x="150" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">LlamaIndex · Docling</text>

        <!-- Redis -->
        <rect x="360" y="72" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="360" y="72" width="200" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="460" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Redis cache</text>
        <text x="460" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">exact cache, never fails a request</text>

        <!-- Elasticsearch (focal) -->
        <rect x="360" y="190" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="360" y="190" width="200" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="460" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Elasticsearch</text>
        <text x="460" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">versioned index + alias</text>

        <!-- Telemetry (optional) -->
        <rect x="360" y="296" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="360" y="296" width="200" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.20"/>
        <text x="460" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Telemetry and cost</text>
        <text x="460" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">OTel · Prometheus · ledger</text>

        <!-- Hybrid search -->
        <rect x="700" y="84" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="84" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="800" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Hybrid search</text>
        <text x="800" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">BM25 + vector · RRF</text>

        <!-- Rerank -->
        <rect x="700" y="190" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="190" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="800" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Cross-encoder rerank</text>
        <text x="800" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">bge-reranker-base</text>

        <!-- ask_docs (focal) -->
        <rect x="700" y="296" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="296" width="200" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="800" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">ask_docs graph</text>
        <text x="800" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">LangGraph · rewrite · judge</text>

        <!-- Answer -->
        <rect x="700" y="402" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="402" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="800" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Answer</text>
        <text x="800" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">numbered citations · HTTP, MCP</text>

        <!-- legend -->
        <line x1="30" y1="504" x2="930" y2="504" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="30" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="110" y="518" width="20" height="12" rx="3" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="138" y="527" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">FOCAL: SHARED INDEX, AGENT</text>
        <line x1="360" y1="524" x2="388" y2="524" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <text x="398" y="527" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">DATA PATH</text>
        <line x1="500" y1="524" x2="528" y2="524" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>
        <text x="538" y="527" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">SIDE PATH: CACHE, TELEMETRY</text>
      </svg>
