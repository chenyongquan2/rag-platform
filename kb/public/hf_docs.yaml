# Hugging Face documentation (Markdown, English). Design s5-1.
kb: hf_docs
source:
  connector: hf_dataset
  dataset: m-ric/huggingface_doc
  manifest: data/manifests/hf_docs.json   # pinned files, sha256, rows, license (spec P0-03)
  limit: 50            # null = all 2,647 documents; start small until the flow runs end to end
language: en
pipelines:
  ".md": &markdown
    reader: markdown
    clean:             # runs before the IngestionPipeline (spec P0-04); remove a line to turn a rule off
      - hf_first_char  # the dataset export dropped the first character of most pages
      - front_matter
      - md_markup
      - whitespace
      - skip_empty: {min_chars: 20}
      - dedupe
      - detect_language
      - suspicious_instruction
    steps:
      - markdown_split
      - token_split: {max_tokens: 400}   # reranker tokens for text + title_path + source_rel
      - merge_tiny: {min_tokens: 50}
      - suspicious_instruction           # per-chunk flag
      - assign_chunk_ids
  ".mdx": *markdown
  ".ipynb": *markdown  # the dataset stores notebooks already flattened to Markdown text
metadata:
  embed: [title_path]               # whitelist: only these keys go into the embedding text
  llm: [title_path, source_rel]     # whitelist: only these keys go into the prompt
es:
  analyzer: standard
retrieval:
  top_k_per_route: 20
  rerank_n: 30
  final_k: 8
  threshold: 0.3
eval:
  dir: evals/datasets/hf_docs
access:
  callers: ["*"]
