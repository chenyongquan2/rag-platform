# Hugging Face documentation (Markdown, English). Design s5-1.
kb: hf_docs
description: >-
  Hugging Face documentation in English (Transformers, Datasets, Hub, Diffusers,
  Inference Endpoints and other libraries): guides, API references and tutorials.
source:
  connector: hf_dataset
  dataset: m-ric/huggingface_doc
  manifest: data/manifests/hf_docs.json   # pinned files, sha256, rows, license (spec P0-03)
  limit: null          # null = all 2,647 documents (full run since P0-12); --limit N for a quick run
language: en
pipelines:
  ".md": &markdown
    reader: markdown
    clean:             # runs before the IngestionPipeline (spec P0-04); remove a line to turn a rule off
      - hf_first_char  # the dataset export dropped the first character of most pages
      - front_matter
      - md_markup
      - whitespace
      - skip_empty: {min_chars: 20}
      - dedupe
      - detect_language
      - suspicious_instruction
    steps:
      - markdown_split
      - token_split: {max_tokens: 400}   # reranker tokens for text + title_path + source_rel
      - merge_tiny: {min_tokens: 50}
      - suspicious_instruction           # per-chunk flag
      - assign_chunk_ids
  ".mdx": *markdown
  ".ipynb": *markdown  # the dataset stores notebooks already flattened to Markdown text
metadata:
  embed: [title_path]               # whitelist: only these keys go into the embedding text
  llm: [title_path, source_rel]     # whitelist: only these keys go into the prompt
es:
  analyzer: standard
retrieval:
  top_k_per_route: 20
  num_candidates: 100  # kNN candidates; tune on the question set (s9-1)
  title_boost: 1.0     # title_path weight against content in the BM25 multi_match; 2.0 let short
                       # section titles that match only question words win (P0-13, docs/decisions.md)
  rrf_k: 60
  rrf_weights: {bm25: 1.0, vector: 1.0}   # equal (s9-3); vector 1.5-3 tried in P0-13, not better
  rerank_n: 10         # fused candidates sent to the reranker (s10-1); P0-12 curve, docs/decisions.md
  final_k: 8
  threshold: 0.3       # rerank score (0 to 1) a chunk needs; P0-13 calibration on 65 + 10 no-answer
                       # questions (docs/decisions.md); recheck on the P1-05 dev set
  expand: none         # none | neighbors | parent: context added around returned chunks (s10-3)
  expand_window: 1     # neighbors: chunks on each side
  expand_max_tokens: 4000
eval:
  dir: evals/datasets/hf_docs
  questions: huggingface_doc_qa_eval.jsonl   # the 65 public questions; no_answer.jsonl is a separate set
access:
  callers: ["*"]
answer:
  context_tokens: 4000   # estimated tokens of all numbered fragments (s10-3)
  language: auto         # answer in the question's language; zh or en fixes it (s8-4)
  parse_retries: 1       # one more model call when the answer cites no fragment (s11-1)
agent:
  max_rounds: 3          # retrieval rounds of one ask_docs request at most (s13-4: three rounds)
  rewrite: true          # the small model rewrites the question when rules cannot (s8-2, s13-3)
  declarative: false     # false since P3-06: the declarative rewrite did not find the gold page more often
                         # than the question itself (P3-05: 63 against 64 on 65 single-hop questions) and
                         # cost a model call (2.7 s, 0.004 CNY) on 96% of questions; a follow-up or a
                         # two-hop question still goes to the model. true = the P3-02 behaviour.
  max_sub_questions: 3   # a two-hop question makes at most this many searches
  clarify: true          # ask the caller back once when the question names nothing to search
  route_model: true      # the small model decides what the rules leave open
  judge: true            # after each round: enough / partly enough / not enough (s13-4); off = one round
  multi_queries: 3       # round 2 asks each missing sub-question in this many other phrasings
  hyde: true             # round 3 searches with a hypothetical answer passage
  judge_skip_score: 0.98 # P3-06: a sub-question with a chunk scored >= 0.98 is grounded without asking
                         # the judge model (P3-05 records: 73 of 100 answerable questions, judge
                         # accuracy 95/100 against 92/100 with the model); null = always ask (P3-03).
