kb: pdf_demo
description: Four public machine-learning papers (ResNet, Batch Normalization, VGG,
  Adam) read as PDF pages with tables kept whole and figures described by a model,
  plus one chart image. Answers can cite the page number.
source:
  connector: pdf_dir
  path: data/raw/pdf_demo
  files: null
  limit: null
  docling:
    ocr: false
    table_structure: true
    images_scale: 2.0
    num_threads: 4
  cache_dir: data/cache/pdf
language: en
pipelines:
  .pdf:
    reader: pdf
    reader_params:
      describe_images: model
      vision_model: qwen/qwen3.6-flash
      min_image_px: 64
      max_image_px: 1024
      cache_path: data/cache/model_text.sqlite3
      budget_cny: 0.5
    clean:
    - whitespace
    - skip_empty:
        min_chars: 20
    - dedupe
    - suspicious_instruction
    steps:
    - markdown_split
    - table_chunks
    - token_split:
        max_tokens: 400
    - merge_tiny:
        min_tokens: 50
    - mark_generated_text
    - table_summary:
        mode: 'off'
        model: qwen/qwen3.6-flash
        cache_path: data/cache/model_text.sqlite3
        budget_cny: 0.5
    - suspicious_instruction
    - assign_chunk_ids
  .png: &id001
    reader: image
    reader_params:
      describe_images: model
      vision_model: qwen/qwen3.6-flash
      min_image_px: 64
      max_image_px: 1024
      cache_path: data/cache/model_text.sqlite3
      budget_cny: 0.5
    clean:
    - whitespace
    - skip_empty:
        min_chars: 20
    - suspicious_instruction
    steps:
    - markdown_split
    - token_split:
        max_tokens: 400
    - merge_tiny:
        min_tokens: 50
    - mark_generated_text
    - suspicious_instruction
    - assign_chunk_ids
  .jpg: *id001
  .jpeg: *id001
metadata:
  embed:
  - title_path
  llm:
  - title_path
  - source_rel
  - page
es:
  analyzer: standard
retrieval:
  top_k_per_route: 20
  num_candidates: 100
  title_boost: 1.0
  rrf_k: 60
  rrf_weights:
    bm25: 1.0
    vector: 1.0
  rerank_n: 15
  final_k: 8
  threshold: 0.3
  expand: none
  expand_window: 1
  expand_max_tokens: 4000
  replace_table_summaries: false
  replace_table_summaries_after_rerank: true
eval:
  dir: evals/datasets/pdf_demo
  questions: questions.jsonl
access:
  callers:
  - local
answer:
  context_tokens: 4000
  language: auto
  parse_retries: 1
